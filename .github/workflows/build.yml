name: Build Beamer PDF

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fira fonts
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sL "https://github.com/mozilla/Fira/archive/refs/heads/master.tar.gz" | \
            tar xz -C /tmp --wildcards "*/ttf/FiraSans*.ttf" "*/ttf/FiraMono*.ttf"
          find /tmp/Fira-master/ttf -name "Fira*.ttf" -exec cp {} ~/.local/share/fonts/ \;
          curl -sLo ~/.local/share/fonts/FiraMath-Regular.otf \
            "https://github.com/firamath/firamath/releases/download/v0.3.4/FiraMath-Regular.otf"
          fc-cache -f

      - name: Install TeX Live
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: >-
            scheme-basic
            beamer
            biblatex
            biblatex-gb7714-2015
            biber
            booktabs
            caption
            carlisle
            catchfile
            chinese-jfm
            ctex
            fandol
            fontspec
            latexmk
            lm
            oberdiek
            pgf
            realscripts
            tools
            unicode-math
            xcolor
            xecjk
            xetex
            xstring
            zhnumber
            collection-fontsrecommended

      - name: Compile Beamer presentation
        run: |
          latexmk -xelatex -halt-on-error -shell-escape -interaction=nonstopmode main.tex

      - name: Show log on failure
        if: failure()
        run: cat main.log || true

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tongji-beamer-defense-ppt
          path: main.pdf
          retention-days: 90
