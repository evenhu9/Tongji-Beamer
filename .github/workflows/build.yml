name: Build Beamer PDF

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX + Beamer + CJK)
        uses: tex-live/setup-texlive-action@v4
        with:
          version: 2024
          packages: |
            beamer
            biblatex
            biblatex-gb7714-2015
            biber
            booktabs
            caption
            ctex
            fandol
            fontspec
            latexmk
            pgf
            realscripts
            unicode-math
            xecjk
            xetex
        env:
          SETUP_TEXLIVE_ACTION_NO_CACHE_ON_FAILURE: 1

      - name: Compile Beamer presentation
        run: |
          latexmk -xelatex -halt-on-error -shell-escape -interaction=nonstopmode main.tex

      - name: Show log on failure
        if: failure()
        run: cat main.log

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tongji-beamer-defense-ppt
          path: main.pdf
          retention-days: 90
