name: Build Beamer PDF

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with xu-cheng/latex-action
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_fonts: |
            ./fonts/FiraSans-Regular.ttf
            ./fonts/FiraSans-Bold.ttf
            ./fonts/FiraSans-Italic.ttf
            ./fonts/FiraSans-BoldItalic.ttf
            ./fonts/FiraMono-Regular.ttf
            ./fonts/FiraMono-Bold.ttf
            ./fonts/FiraMath-Regular.otf

      - name: Show log on failure
        if: failure()
        run: cat main.log || true

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tongji-beamer-defense-ppt
          path: main.pdf
          retention-days: 90
